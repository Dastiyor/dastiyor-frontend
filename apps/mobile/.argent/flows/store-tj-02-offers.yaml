steps:
  - launch: { ios: com.dastiyor.ios, android: com.dastiyor.app }
  - run: store-signin
  - echo: Switch the app to Tajik on the Profile tab.
  - tool: open-url
    args: { url: 'dastiyor://profile' }
  - await: { visible: { text: English } }
  - tap: { text: Тоҷикӣ }
  - await: { visible: { text: Профил } }
  - echo: The signed-in customer's open task with three offers (ids fixed in goldie/demo/seed.mjs).
  - tool: open-url
    args: { url: 'dastiyor://task/demo-task-faucet' }
  - await: { visible: { text: Бахтиёр Одинаев } }
  - await: { idle: true }
